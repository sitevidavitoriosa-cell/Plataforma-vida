<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida Vitoriosa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#e8ecf0;--surface:#ffffff;--ink:#2e3138;--muted:#5f6672;--line:#e3e7ec;--field:#e8ecf0;
  --accent:#7c6b50;--accent2:#c4a882;--link:#7c6b50;--nav:#2e3138;--nav-ink:#d9dce1;
  --good:#3d6b52;--bad:#a4573d;
  --k-sage:#567565;--k-terra:#a4573d;--k-brown:#7c6b50;--k-slate:#4f6378;
  --bad-bg:#f3e3dd;--bad-ink:#8a3f27;--warn-bg:#f1e7d4;--warn-ink:#6e5a2f;
  --ok-bg:#dfe9e3;--ok-ink:#2f5441;--info-bg:#dde4ea;--info-ink:#3b4e63;
  --c0:#7c6b50;--c1:#6f9480;--c2:#b8956a;--c3:#4f6378;--warnbar:#8a6d3b;
  --shadow:0 10px 24px rgba(46,49,56,.07);
  --inset:inset 3px 3px 7px rgba(46,49,56,.12),inset -3px -3px 7px rgba(255,255,255,.9);
  --btn-sh:4px 4px 10px rgba(46,49,56,.12),-4px -4px 10px rgba(255,255,255,.9);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181c;--surface:#23262c;--ink:#eceef1;--muted:#a9b0bb;--line:#343841;--field:#16181c;
    --link:#d2b98f;--nav:#101215;--nav-ink:#cfd3d9;--good:#8cc3a4;--bad:#e7a08a;
    --bad-bg:#46302a;--bad-ink:#f0b9a6;--warn-bg:#443a26;--warn-ink:#e6cf98;
    --ok-bg:#2a3d33;--ok-ink:#a9d1bc;--info-bg:#2d3945;--info-ink:#b4c8dc;
    --c0:#c4a882;--c1:#8fb59f;--c2:#d1a97b;--c3:#8aa3bd;--warnbar:#d1a97b;
    --shadow:0 10px 24px rgba(0,0,0,.35);
    --inset:inset 3px 3px 7px rgba(0,0,0,.5),inset -3px -3px 7px rgba(255,255,255,.04);
    --btn-sh:4px 4px 10px rgba(0,0,0,.45),-4px -4px 10px rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  --bg:#16181c;--surface:#23262c;--ink:#eceef1;--muted:#a9b0bb;--line:#343841;--field:#16181c;
  --link:#d2b98f;--nav:#101215;--nav-ink:#cfd3d9;--good:#8cc3a4;--bad:#e7a08a;
  --bad-bg:#46302a;--bad-ink:#f0b9a6;--warn-bg:#443a26;--warn-ink:#e6cf98;
  --ok-bg:#2a3d33;--ok-ink:#a9d1bc;--info-bg:#2d3945;--info-ink:#b4c8dc;
  --c0:#c4a882;--c1:#8fb59f;--c2:#d1a97b;--c3:#8aa3bd;--warnbar:#d1a97b;
  --shadow:0 10px 24px rgba(0,0,0,.35);
  --inset:inset 3px 3px 7px rgba(0,0,0,.5),inset -3px -3px 7px rgba(255,255,255,.04);
  --btn-sh:4px 4px 10px rgba(0,0,0,.45),-4px -4px 10px rgba(255,255,255,.04);
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
h1{font-size:32px;font-weight:700}
h2{font-size:20px;font-weight:600}
p{margin:0}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
#main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}.mb{margin-bottom:14px}
.ic{flex:none}

/* topo */
.top{background:var(--surface);box-shadow:0 2px 14px rgba(0,0,0,.08)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;flex:none}
.brand-n{line-height:1.15}.brand-n b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:20px}
.brand-n small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.search{flex:1 1 220px;max-width:420px;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--field);border-radius:12px;box-shadow:var(--inset)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px}
.search:focus-within{outline:3px solid var(--link);outline-offset:2px}
.top-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ed-sel{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;background:var(--field);border-radius:12px}
.ed-sel span{font-size:12px;font-weight:600;color:var(--muted)}
.ed-sel select{min-height:44px;border:0;background:transparent;font-weight:800;font-size:15px;cursor:pointer;max-width:200px}
.ed-sel select option{color:#2e3138;background:#fff}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.user{min-height:44px;display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:0 4px;text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.user-t{line-height:1.2}.user-t b{display:block;font-size:14px}.user-t small{font-size:12px;color:var(--muted)}
.nav{background:var(--nav)}
.nav-in{max-width:1280px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:var(--nav-ink);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.08)}
.tab.on{background:var(--accent);color:#fff}
main{max-width:1280px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.ph-a{display:flex;flex-wrap:wrap;gap:12px}

/* blocos */
.card{background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.kpi{color:#fff;border-radius:16px;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.k-sage{background:var(--k-sage)}.k-terra{background:var(--k-terra)}.k-brown{background:var(--k-brown)}.k-slate{background:var(--k-slate)}
.k-l{font-size:14px;font-weight:700}
.k-v{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.k-s{font-size:13px}
.k-i{width:56px;height:56px;flex:none;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.r2{flex:2 1 520px;min-width:0}.r1{flex:1 1 320px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.scroll{overflow-x:auto}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.num{text-align:right}
th.num{text-align:right}
.neg{color:var(--bad);font-weight:800;white-space:nowrap}.pos{color:var(--good);font-weight:800;white-space:nowrap}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-bad{background:var(--bad-bg);color:var(--bad-ink)}.b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-ok{background:var(--ok-bg);color:var(--ok-ink)}.b-info{background:var(--info-bg);color:var(--info-ink)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.note{padding:12px 16px;border-radius:12px;background:var(--field);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.acts-c{display:flex;gap:8px;align-items:center}

/* botões e campos */
.btn{min-height:44px;padding:0 20px;border:0;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--field);color:var(--ink);box-shadow:var(--btn-sh)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:none}
.btn-sm{padding:0 14px;font-size:13px;box-shadow:none}
.btn-block{width:100%;min-height:48px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0 4px;min-height:44px;color:var(--link);font-weight:800;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.form{display:flex;flex-direction:column;gap:16px}
.fg{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:13px;font-weight:800}
.fl small{font-weight:600;color:var(--muted)}
.inp{min-height:48px;width:100%;padding:0 16px;border:0;border-radius:12px;background:var(--field);box-shadow:var(--inset);outline-offset:2px}
.inp.sm{min-height:44px;padding:0 12px;font-size:14px}
textarea.inp{padding:12px 16px;min-height:90px;resize:vertical}
input[type=file].inp{padding:10px 12px;min-height:48px}
.two{display:flex;flex-wrap:wrap;gap:12px}.two>*{flex:1 1 130px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.filters>*{flex:1 1 140px;min-width:0}
.fl-s{font-size:12px;font-weight:800;color:var(--muted)}
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--field)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;text-align:center;padding:0 8px}
.seg input:checked+label{background:var(--accent);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--link)}
.tabs-seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.tabs-seg button{min-height:44px;padding:0 26px;border:0;border-radius:999px;background:transparent;font-weight:800;font-size:14px;cursor:pointer}
.tabs-seg button.on{background:var(--accent);color:#fff}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:2px dashed var(--muted);border-radius:14px;text-align:center;cursor:pointer;background:transparent;width:100%}
.dropzone.over{background:var(--field)}
.chk{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.chk legend{padding:0;margin-bottom:8px}
.chk-i{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--field);box-shadow:var(--inset);cursor:pointer;font-weight:700;font-size:14px}
.chk-i input{width:20px;height:20px;flex:none;accent-color:var(--accent)}

/* permissões por área e setor */
.perm{display:flex;flex-direction:column;gap:12px}
.perm-m{border:1px solid var(--line);margin:0;padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.perm-s{display:flex;flex-direction:column;gap:10px}
.perm-l{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow:auto;padding:4px 2px}
.perm-g{display:flex;flex-direction:column;gap:2px}
.chk-s{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;font-size:14px;cursor:pointer}
.chk-s input{width:20px;height:20px;accent-color:var(--accent);flex:none}

/* configurações */
.sw-row{display:flex;flex-wrap:wrap;gap:10px}
.sw-pick{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;background:var(--field);cursor:pointer;font-weight:700;font-size:14px}
.sw-pick input{position:absolute;opacity:0}
.sw-pick .dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--muted)}
.sw-pick input:checked+.dot{box-shadow:0 0 0 3px var(--ink)}
.sw-pick input:focus-visible+.dot{outline:3px solid var(--link);outline-offset:2px}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.cfg-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.add-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.add-row .inp{flex:1 1 180px}
.cfg-area{padding:10px 0 14px;border-bottom:2px solid var(--line)}
.cfg-area:last-of-type{border-bottom:0}

/* gráficos */
.chart{width:100%;height:auto;display:block}
.chart .lbl{fill:var(--ink);font-size:13px;font-weight:600}
.chart .val{fill:var(--ink);font-size:13px;font-weight:700}
.chart .ax{fill:var(--muted);font-size:12px}
.chart .axb{fill:var(--ink);font-size:12px;font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .bar{fill:var(--c0)}.chart .ge{fill:var(--c1)}.chart .gs{fill:var(--bad)}
.donut{display:block;width:200px;max-width:100%;height:auto;margin:0 auto}
.dn-track{stroke:var(--field)}
.dn{fill:none}.dn.c0{stroke:var(--c0)}.dn.c1{stroke:var(--c1)}.dn.c2{stroke:var(--c2)}.dn.c3{stroke:var(--c3)}
.dn-v{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;fill:var(--ink)}
.dn-s{font-size:12px;fill:var(--muted)}
.lgs{margin-top:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.lg{display:flex;align-items:center;gap:10px}.lg span:nth-child(2){flex:1}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.c0b{background:var(--c0)}.c1b{background:var(--c1)}.c2b{background:var(--c2)}.c3b{background:var(--c3)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend div{display:flex;align-items:center;gap:8px}
.bar-t{width:110px;height:8px;margin-top:4px;border-radius:999px;background:var(--field)}
.bar-f{display:block;height:8px;border-radius:999px}
.bf-ok{background:var(--k-sage)}.bf-low{background:var(--warnbar)}.bf-crit{background:var(--k-terra)}.bf-acc{background:var(--c0)}

/* atividade */
.act{display:flex;align-items:center;gap:12px}
.acts{display:flex;flex-direction:column;gap:16px}
.act-i{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.act-t{font-size:14px;font-weight:700}

/* linha do tempo */
.tl{position:relative;min-width:620px}
.tl-row{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.tl-n{font-weight:800;font-size:14px}
.tl-track{position:relative;height:36px}
.tl-head .tl-track{height:22px;font-size:12px;font-weight:700;color:var(--muted)}
.tl-head .tl-track span{position:absolute}
.tl-pill{transform:translateX(-50%);padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:11px}
.tl-bar{position:absolute;top:0;height:36px;padding:0 12px;display:flex;align-items:center;border-radius:10px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-a{background:var(--k-brown);color:#fff}.tl-b{background:var(--k-slate);color:#fff}
.tl-p{border:2px dashed var(--warnbar);background:var(--warn-bg);color:var(--warn-ink)}
.tl-c{background:var(--field);color:var(--muted)}
.tl-ov{position:absolute;left:92px;right:0;top:0;bottom:0;pointer-events:none}
.tl-today{position:absolute;top:22px;bottom:0;width:2px;background:var(--ink);opacity:.7}

/* organizacional */
.org{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.org-side{flex:1 1 240px;max-width:300px;min-width:0}
.org-main{flex:999 1 520px;min-width:0}
.tr{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;text-align:left;cursor:pointer}
.tr span:nth-of-type(1){flex:1}
.tr small{font-size:12px;color:var(--muted)}
.tr.on{background:var(--accent);color:#fff}.tr.on small{color:#fff}
.tr.l1{padding-left:38px}
.vis{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--field);font-size:13px;font-weight:700}
.fi{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.fcell{display:flex;align-items:center;gap:12px}

/* login: metade com foto, metade com o formulário */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login-photo{flex:1 1 420px;min-width:0;min-height:260px;background-color:#2e3138;background-image:var(--login-photo,linear-gradient(135deg,var(--accent),#2e3138));background-position:center;background-size:cover;background-repeat:no-repeat}
.login-wrap{flex:1 1 420px;min-width:0;padding:40px 20px;display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:420px;padding:36px;border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.16)}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{max-width:460px;width:100%;padding:32px}
/* modal e aviso */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--surface);color:var(--ink);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg.wide{max-width:720px}
.dlg h2{margin-bottom:12px}
.dlg-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:20px}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{padding:8px 0;border-bottom:1px solid var(--line)}.kv td:last-child{text-align:right;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
@media (max-width:640px){
  h1{font-size:26px}
  .card{padding:16px}
  .login-photo{flex-basis:100%;min-height:180px}
  .login-card{padding:24px}
  .user-t{display:none}
}

/* ===== Novo layout limpo e mobile-first ===== */
body{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.kpi{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line);box-shadow:none!important;padding:16px 18px}
.kpi .k-i{display:none}
.kpi .k-l{color:var(--muted)!important;font-weight:700}
.kpi .k-v{color:var(--ink)!important}
.kpi .k-s{color:var(--muted)!important}
.card{box-shadow:none!important;border:1px solid var(--line)}
.top{box-shadow:none;border-bottom:1px solid var(--line)}
.bnav{display:none}
.hdr{position:sticky;top:0;z-index:35;background:var(--bg)}
@media (max-width:820px){.hdr{position:static}}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>Ative o JavaScript para usar a plataforma.</noscript>
<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nfBRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const nfBRL0 = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits:0, maximumFractionDigits:0});
const brl = n => nfBRL.format(Math.round(n * 100) / 100);
const brl0 = n => nfBRL0.format(n);
const signed = n => (n >= 0 ? '+ ' : '− ') + brl(Math.abs(n));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoOf(new Date());
const curYM = () => today().slice(0, 7);
const parseISO = iso => { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const days = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const dmy = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '—';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mesLabel = ym => cap(MESES[+ym.slice(5, 7) - 1]) + ' de ' + ym.slice(0, 4);
let seq = 0;
const nid = p => p + (++seq) + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const fmtQ = n => Number.isInteger(n) ? String(n) : n.toLocaleString('pt-BR');
const retiroLabel = e => {
  const a = e.ini, b = e.fim;
  return a.slice(0, 7) === b.slice(0, 7) ? a.slice(8, 10) + ' a ' + b.slice(8, 10) + '/' + b.slice(5, 7) : dmy(a) + ' a ' + dmy(b);
};
const parseMoney = s => {
  s = String(s || '').replace(/R\$|\s/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
};
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
const initials = nome => nome.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w.charAt(0).toUpperCase()).join('');
const mixHex = (hex, t) => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = c => Math.round(c + (255 - c) * t); return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join(''); };

/* ---------- padrões (tudo isto pode ser editado em Configurações) ---------- */
const GERAL = '*geral';
const MODS = ['edicoes', 'financeiro', 'estoque', 'organizacional', 'equipe', 'relatorios'];
const MOD_ICON = {edicoes:'cal', financeiro:'wallet', estoque:'boxes', organizacional:'folder', equipe:'users', relatorios:'chart'};
const DEF_MENU = {inicio:'Início', edicoes:'Edições', financeiro:'Financeiro', estoque:'Estoque', organizacional:'Organizacional', equipe:'Equipe', relatorios:'Relatórios', acessos:'Acessos', config:'Configurações'};
const PRESETS = [['#7c6b50', 'Marrom'], ['#3b5f8a', 'Azul'], ['#2f6b57', 'Verde'], ['#7a4f6d', 'Ameixa'], ['#a4573d', 'Terracota'], ['#4f6378', 'Grafite']];
const DEF_AREAS = [
  {nome:'Apoio', setores:['Templo', 'Placa', 'Silêncio']},
  {nome:'Eclesiástico', setores:['Teatro', 'Louvor', 'Intercessão']},
  {nome:'Administrativo', setores:['Secretaria 1', 'Secretaria 2', 'Material de Dinâmicas']},
  {nome:'Logística', setores:['Som', 'Estacionamento', 'Recepção', 'Saúde', 'Refeitório']}
];

/* ---------- estado e ligação com o Firebase ---------- */
let BE = null, S = null, U = null, AU = null, phase = 'pre', fatalMsg = '';
const PREFS = 'vv-gestao-prefs';
const mkUI = () => ({view:'inicio', login:{modo:'entrar'}, fin:{tipo:'all', setor:'all', cat:'all', q:'', lim:12}, est:{setor:'all', sit:'all', aba:'geral'}, org:{pasta:'geral', open:{}, q:'', ord:'recentes'}, eq:{alvo:'all', q:''}, rel:{modo:'mensal', mes:null, ano:null}, search:''});
const emptyState = () => ({cfg:null, users:[], convites:[], team:[], ed:[], lanc:[], items:[], movs:[], files:[], userId:null, selEd:'all', theme:'auto'});
let selPref = false;
function loadPrefs(){ try { const p = JSON.parse(localStorage.getItem(PREFS) || '{}'); if (p.theme) S.theme = p.theme; if (p.selEd){ S.selEd = p.selEd; selPref = true; } } catch (e) {} }
function save(){ try { localStorage.setItem(PREFS, JSON.stringify({theme:S.theme, selEd:S.selEd})); } catch (e) {} }
function defaultCfg(){
  return {
    nome:'Vida Vitoriosa', sub:'Plataforma de gestão', sigla:'V', cor:'#7c6b50',
    menu:Object.assign({}, DEF_MENU),
    areas:DEF_AREAS.map(a => ({nome:a.nome, setores:a.setores.slice()})),
    cargos:['Presidente', 'Gestor', 'Líder', 'Vice', 'Membro'],
    unidades:['un', 'rolos', 'fls', 'caixas', 'pacotes', 'kg', 'litros'],
    cats:['Material', 'Serviços', 'Alimentação', 'Impressão', 'Receita', 'Outros']
  };
}
const normCfg = c => { const o = Object.assign(defaultCfg(), c || {}); o.menu = Object.assign({}, DEF_MENU, (c && c.menu) || {}); return o; };

/* ---------- dados em tempo real (cada pessoa só recebe o que as regras deixam) ---------- */
let unsubs = [], parts = {}, rT = null, pend = false, forceNext = false, permKey = '', seeding = false, edDocs = [], edFin = {}, selInit = false, errT = 0;
function stopAll(){
  unsubs.splice(0).forEach(u => { try { u(); } catch (e) {} });
  parts = {}; edDocs = []; edFin = {}; selInit = false; seeding = false;
}
function dataErr(what, e){
  console.error(what, e);
  const t = Date.now(); if (t - errT < 4000) return; errT = t;
  toast(e && e.code === 'permission-denied' ? 'Sem permissão para carregar parte dos dados. Confira se as regras do Firebase foram publicadas.' : 'Falha ao carregar os dados. Confira a conexão.');
}
function mergeEd(){
  S.ed = edDocs.map(e => Object.assign({}, e, edFin[e.id] ? {saldoInicial:edFin[e.id].saldoInicial, snap:edFin[e.id].snap} : {}));
  if (!selInit && edDocs.length){
    selInit = true;
    if (S.selEd !== 'all' && !edDocs.some(e => e.id === S.selEd)) S.selEd = 'all';
  }
  if (!selPref && S.selEd === 'all'){ const o = S.ed.filter(e => e.status === 'aberta').sort((a, b) => a.ini.localeCompare(b.ini))[0]; if (o) S.selEd = o.id; }
}
const typing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !/^(button|submit|checkbox|radio|file)$/.test(a.type || '')); };
function scheduleRender(force){
  if (force) forceNext = true;
  if (rT) return;
  rT = setTimeout(() => { rT = null; if (!force && typing()){ pend = true; return; } pend = false; render(); }, 30);
}
function planKeys(mods){
  if (isAdmin()) return 'all';
  const keys = new Set();
  for (const m of mods){ const p = pOf(m); if (!p || p === true) continue; if (p.all) return 'all'; (p.s || []).forEach(k => keys.add(k)); }
  return keys.size ? Array.from(keys) : null;
}
function watch(coll, target, mods, field){
  const plan = planKeys(mods); S[target] = []; parts[coll] = {};
  if (!plan) return;
  const flts = plan === 'all' ? [null] : plan.map(k => ({field, eq:k}));
  flts.forEach((flt, i) => unsubs.push(BE.db.listenQuery(coll, flt, docs => { parts[coll][i] = docs; S[target] = [].concat.apply([], Object.keys(parts[coll]).map(k => parts[coll][k])); scheduleRender(); }, e => dataErr(coll, e))));
}
let cfgSeeded = false;
function startData(){
  stopAll(); cfgSeeded = false;
  permKey = JSON.stringify((ME() || {}).perm || {});
  S.lanc = []; S.items = []; S.movs = []; S.files = []; S.team = []; S.ed = []; S.convites = [];
  unsubs.push(BE.db.listenDoc('config/app', cfg => {
    if (cfg){ S.cfg = normCfg(cfg); applyBrand(); applyTheme(); scheduleRender(true); }
    else if (isAdmin()){ if (!cfgSeeded){ cfgSeeded = true; BE.db.set('config/app', defaultCfg()).catch(e => dataErr('config', e)); } }
    else { S.cfg = null; scheduleRender(true); }
  }, e => dataErr('config', e)));
  if (isAdmin()){
    unsubs.push(BE.db.listenQuery('users', null, d => { S.users = d; scheduleRender(); }, e => dataErr('users', e)));
    unsubs.push(BE.db.listenQuery('convites', null, d => { S.convites = d; scheduleRender(); }, e => dataErr('convites', e)));
  } else {
    unsubs.push(BE.db.listenDoc('users/' + AU.uid, d => {
      if (!d){ stopAll(); phase = 'sem-acesso'; S.userId = null; render(); return; }
      S.users = [Object.assign({id:AU.uid}, d)];
      if (JSON.stringify(d.perm || {}) !== permKey){ startData(); scheduleRender(true); return; }
      scheduleRender();
    }, e => dataErr('users', e)));
  }
  unsubs.push(BE.db.listenQuery('edicoes', null, d => { edDocs = d; mergeEd(); scheduleRender(); }, e => dataErr('edicoes', e)));
  if (planKeys(['financeiro', 'relatorios']) === 'all') unsubs.push(BE.db.listenQuery('edicoes_fin', null, d => { edFin = {}; d.forEach(x => { edFin[x.id] = x; }); mergeEd(); scheduleRender(); }, e => dataErr('edicoes_fin', e)));
  watch('lancamentos', 'lanc', ['financeiro', 'relatorios'], 'chave');
  watch('itens', 'items', ['estoque', 'relatorios'], 'setor');
  watch('movimentos', 'movs', ['estoque', 'relatorios'], 'setor');
  watch('arquivos', 'files', ['organizacional'], 'chave');
  watch('equipe', 'team', ['equipe'], 'chave');
}

/* ---------- login: descobrir o que cada pessoa pode acessar ---------- */
let accTok = 0;
async function resolveAccess(){
  const tok = ++accTok;
  stopAll();
  S = Object.assign(emptyState(), {theme:S.theme, selEd:S.selEd});
  if (!AU){ phase = 'login'; U = mkUI(); render(); return; }
  if (!AU.emailVerified){ phase = 'verify'; render(); return; }
  phase = 'checando'; render();
  try {
    const mail = AU.email.toLowerCase();
    let ud = await BE.db.get('users/' + AU.uid);
    if (!ud){
      const inv = await BE.db.get('convites/' + mail);
      if (inv){
        ud = {nome:inv.nome || mail.split('@')[0], email:mail, papel:'visitante', perm:inv.perm || {}};
        await BE.db.set('users/' + AU.uid, ud);
      } else {
        const adm = {nome:AU.displayName || mail.split('@')[0], email:mail, papel:'admin', perm:{}};
        try { await BE.db.set('users/' + AU.uid, adm); ud = adm; } catch (e) { ud = null; }
      }
    }
    if (tok !== accTok) return;
    if (!ud){ phase = 'sem-acesso'; render(); return; }
    S.userId = AU.uid; S.users = [Object.assign({id:AU.uid}, ud)]; U = mkUI();
    phase = 'app'; startData(); render();
  } catch (e) {
    if (tok !== accTok) return;
    console.error(e); fatalMsg = (e && e.code) ? e.code : String(e); phase = 'erro'; render();
  }
}
function startApp(backend, configOk){
  clearTimeout(window.__vvWatch);
  BE = backend; S = emptyState(); U = mkUI(); selPref = false; loadPrefs(); applyTheme();
  if (!backend || configOk === false){ phase = 'sem-config'; render(); return; }
  phase = 'boot'; render();
  BE.auth.onChange(u => { AU = u; resolveAccess(); });
}
function authMsg(e){
  const c = (e && e.code) || '';
  const m = {
    'auth/invalid-credential':'E-mail ou senha incorretos.', 'auth/wrong-password':'E-mail ou senha incorretos.', 'auth/invalid-login-credentials':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Não encontramos essa conta. Use “Primeiro acesso”.', 'auth/invalid-email':'E-mail inválido.',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Use “Entrar” ou “Esqueci a senha”.', 'auth/weak-password':'Escolha uma senha com pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.', 'auth/network-request-failed':'Sem conexão. Tente de novo.',
    'auth/operation-not-allowed':'Ative o login por e-mail e senha no Firebase (Authentication).', 'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).'
  };
  return m[c] || ('Não foi possível concluir (' + (c || 'erro') + ').');
}

/* ---------- configuração: nomes, áreas e setores vêm dos dados ---------- */
const lab = k => (S && S.cfg && S.cfg.menu && S.cfg.menu[k]) || DEF_MENU[k];
const allSetores = () => S.cfg.areas.reduce((a, x) => a.concat(x.setores), []);
const setorArea = s => { const a = S.cfg.areas.find(x => x.setores.indexOf(s) >= 0); return a ? a.nome : ''; };
const setoresDe = a => { const x = S.cfg.areas.find(y => y.nome === a); return x ? x.setores : []; };
function applyBrand(){
  const c = S.cfg.cor, l = mixHex(c, 0.38);
  let el = $('#brand');
  if (!el){ el = document.createElement('style'); el.id = 'brand'; document.head.appendChild(el); }
  el.textContent = ':root{--accent:' + c + ';--k-brown:' + c + ';--link:' + c + ';--c0:' + c + ';--accent2:' + l + '}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--link:' + l + ';--c0:' + l + '}}:root[data-theme="dark"]{--link:' + l + ';--c0:' + l + '}';
  document.title = S.cfg.nome;
}

/* ---------- acesso: administrador vê e edita tudo; visitante vê só o que foi liberado, por área e por setor ---------- */
const ME = () => S.users.find(u => u.id === S.userId);
const isAdmin = () => { const u = ME(); return !!u && u.papel === 'admin'; };
const pOf = m => { const u = ME(); if (!u) return null; if (u.papel === 'admin') return 'ALL'; return (u.perm && u.perm[m]) || null; };
const okS = (m, s) => { const p = pOf(m); if (p === 'ALL') return true; if (!p) return false; if (p === true) return true; return !!p.all || p.s.indexOf(s) >= 0; };
const okArea = m => { const p = pOf(m); if (p === 'ALL' || p === true) return true; return !!p && !!p.all; };
const can = m => { const p = pOf(m); if (p === 'ALL' || p === true) return true; if (!p) return false; return !!p.all || p.s.length > 0; };
const full = ms => isAdmin() || ms.some(m => { const p = pOf(m); return p && p !== true && p.all; });
const moneyFull = () => full(['financeiro', 'relatorios']);
const stockFull = () => full(['estoque', 'relatorios']);
const canMoney = () => can('financeiro') || can('relatorios');
const canStock = () => can('estoque') || can('relatorios');
const ctxMods = kind => {
  const v = U.view;
  if (kind === 'money') return v === 'financeiro' ? ['financeiro'] : v === 'relatorios' ? ['relatorios'] : ['financeiro', 'relatorios'];
  return v === 'estoque' ? ['estoque'] : v === 'relatorios' ? ['relatorios'] : ['estoque', 'relatorios'];
};
const okCtx = (kind, s) => ctxMods(kind).some(m => okS(m, s));
const needAdmin = () => { if (!isAdmin()){ toast('Somente administradores fazem isso.'); return true; } return false; };
const edById = id => S.ed.find(e => e.id === id);
const edName = id => (edById(id) || {}).nome || '—';
const itemById = id => S.items.find(i => i.id === id);
const openEds = () => S.ed.filter(e => e.status === 'aberta').sort((a, b) => a.ini.localeCompare(b.ini));
const inSel = x => S.selEd === 'all' || x.ed === S.selEd;
const pastaOk = k => k === 'geral' ? okS('organizacional', GERAL) : k.indexOf('area:') === 0 ? okArea('organizacional', k.slice(5)) : okS('organizacional', k.slice(6));
const teamOk = t => t.alvo === GERAL ? okS('equipe', GERAL) : t.alvo.indexOf('area:') === 0 ? okArea('equipe', t.alvo.slice(5)) : okS('equipe', t.alvo.slice(6));
const visLanc = () => S.lanc.filter(l => okCtx('money', l.setor || GERAL));
const visItems = () => S.items.filter(i => okCtx('stock', i.setor));
const visMovs = () => S.movs.filter(m => { const it = itemById(m.item); return it && okCtx('stock', it.setor); });
const visFiles = () => S.files.filter(f => pastaOk(f.pasta));
const visTeam = () => S.team.filter(teamOk);
const entradas = L => sum(L.filter(l => l.tipo === 'receita'), l => l.valor);
const saidas = L => sum(L.filter(l => l.tipo === 'despesa'), l => l.valor);
const saldoGeral = () => entradas(S.lanc) - saidas(S.lanc);
const sit = it => (it.min <= 0 || it.qtd >= it.min) ? 'ok' : (it.qtd / it.min <= 0.30 ? 'crit' : 'low');
const edTot = e => { const L = S.lanc.filter(l => l.ed === e.id); const en = entradas(L), sa = saidas(L); return {ent:en, sai:sa, res:en - sa}; };
const edTxt = () => S.selEd === 'all' ? 'Todas as edições' : edName(S.selEd);
function porSetor(L){
  const m = {};
  L.filter(l => l.tipo === 'despesa').forEach(l => { m[l.setor] = (m[l.setor] || 0) + l.valor; });

function barH(items, label){
  if (!items.length) return '<div class="empty">Sem despesas para mostrar.</div>';
  const max = Math.max.apply(null, items.map(i => i.value)), rowH = 46, h = items.length * rowH + 14;
  let g = '';
  items.forEach((it, i) => {
    const y = 16 + i * rowH, w = Math.max(4, Math.round(it.value / max * 360));
    g += '<text class="lbl" x="0" y="' + (y + 17) + '">' + esc(it.label) + '</text><rect class="bar" x="170" y="' + y + '" width="' + w + '" height="24" rx="6"/><text class="val" x="' + (180 + w) + '" y="' + (y + 17) + '">' + brl0(it.value) + '</text>';
  });
  return '<svg viewBox="0 0 620 ' + h + '" class="chart" role="img" aria-label="' + esc(label) + '">' + g + '</svg>';
}
function donut(segs, centro){
  const total = sum(segs, s => s.value);
  if (!total) return '<div class="empty">Sem despesas para mostrar.</div>';
  const C = 2 * Math.PI * 70; let off = 0, circ = '', leg = '';
  segs.forEach((s, i) => {
    const len = s.value / total * C;
    circ += '<circle class="dn c' + (i % 4) + '" cx="100" cy="100" r="70" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"/>';
    off += len;
    leg += '<div class="lg"><span class="sw c' + (i % 4) + 'b"></span><span>' + esc(s.label) + '</span><b>' + Math.round(s.value / total * 100) + '% · ' + brl0(s.value) + '</b></div>';
  });
  return '<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Gráfico de rosca dos gastos por área"><g transform="rotate(-90 100 100)" fill="none" stroke-width="28"><circle class="dn-track" cx="100" cy="100" r="70"/>' + circ + '</g><text class="dn-v" x="100" y="101" text-anchor="middle">' + brl0(total) + '</text><text class="dn-s" x="100" y="120" text-anchor="middle">' + esc(centro) + '</text></svg><div class="lgs">' + leg + '</div>';
}
function groupedBars(data){
  const max = Math.max(1, Math.max.apply(null, data.map(d => Math.max(d.e, d.s))));
  const steps = [500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
  let step = steps.find(s => max / s <= 3) || 100000, grid = '';
  for (let k = 1; k * step <= max; k++){
    const y = 240 - k * step / max * 200;
    grid += '<line class="grid" x1="50" y1="' + y.toFixed(1) + '" x2="890" y2="' + y.toFixed(1) + '"/><text class="ax" x="0" y="' + (y + 4).toFixed(1) + '">' + (step >= 1000 ? (k * step / 1000) + ' mil' : k * step) + '</text>';
  }
  let bars = '', labs = '';
  data.forEach((d, i) => {
    const x0 = 60 + i * 68;
    if (d.e > 0){ const h = d.e / max * 200; bars += '<rect class="ge" x="' + x0 + '" y="' + (240 - h).toFixed(1) + '" width="24" height="' + h.toFixed(1) + '" rx="4"/>'; }
    if (d.s > 0){ const h = d.s / max * 200; bars += '<rect class="gs" x="' + (x0 + 28) + '" y="' + (240 - h).toFixed(1) + '" width="24" height="' + h.toFixed(1) + '" rx="4"/>'; }
    labs += '<text class="' + (d.future ? 'ax' : 'axb') + '" x="' + (x0 + 26) + '" y="262" text-anchor="middle">' + d.lbl + '</text>';
  });
  return '<div class="scroll"><svg viewBox="0 0 900 280" class="chart" style="min-width:640px" role="img" aria-label="Gráfico de barras com as entradas e saídas de cada mês">' + grid + '<line class="base" x1="50" y1="240" x2="890" y2="240"/>' + bars + labs + '</svg></div>';
}

/* ---------- Edições ---------- */
function timeline(){
  const rec = S.ed.filter(e => e.status === 'fechada').sort((a, b) => b.fechadaEm.localeCompare(a.fechadaEm)).slice(0, 1);
  const list = S.ed.filter(e => e.status !== 'fechada').concat(rec);
  if (!list.length) return '<div class="empty">Nenhuma edição cadastrada.</div>';
  const t = today();
  const w = list.map(e => {
    let s, en;
    if (e.status === 'fechada'){ s = e.abertaEm; en = e.fechadaEm; }
    else if (e.status === 'aberta'){ s = e.abertaEm; en = addDays(e.fim, 7); if (en < t) en = addDays(t, 3); }
    else { s = addDays(e.ini, -14); en = addDays(e.fim, 7); }
    return {e, s, en};
  }).sort((a, b) => a.s.localeCompare(b.s));
  let mn = w.reduce((m, x) => x.s < m ? x.s : m, w[0].s), mx = w.reduce((m, x) => x.en > m ? x.en : m, w[0].en);
  mn = addDays(mn, -1); mx = addDays(mx, 2);
  const span = Math.max(1, days(mn, mx));
  const pct = d => Math.max(0, Math.min(100, days(mn, d) / span * 100));
  let c = parseISO(mn); c = new Date(c.getFullYear(), c.getMonth(), 1);
  if (isoOf(c) < mn) c = new Date(c.getFullYear(), c.getMonth() + 1, 1);
  let mon = '';
  while (isoOf(c) <= mx){ mon += '<span style="left:' + pct(isoOf(c)).toFixed(1) + '%">' + MES3[c.getMonth()] + '</span>'; c = new Date(c.getFullYear(), c.getMonth() + 1, 1); }
  const showT = t >= mn && t <= mx, tp = pct(t).toFixed(1);
  let openIdx = 0;
  const rows = w.map(x => {
    const e = x.e, l = pct(x.s), wd = Math.max(3, pct(x.en) - l);
    let cls, txt;
    if (e.status === 'aberta'){ cls = (openIdx++ % 2 ? 'tl-b' : 'tl-a'); txt = 'Aberta · retiro ' + retiroLabel(e); }
    else if (e.status === 'planejada'){ cls = 'tl-p'; txt = 'Planejada · retiro ' + retiroLabel(e); }
    else { cls = 'tl-c'; txt = 'Fechada em ' + dmy(e.fechadaEm); }
    return '<div class="tl-row"><div class="tl-n">' + esc(e.nome) + '</div><div class="tl-track"><div class="tl-bar ' + cls + '" style="left:' + l.toFixed(1) + '%;width:' + wd.toFixed(1) + '%" title="' + esc(txt) + '">' + esc(txt) + '</div></div></div>';
  }).join('');
  return '<div class="scroll"><div class="tl"><div class="tl-row tl-head"><div></div><div class="tl-track">' + mon + (showT ? '<span class="tl-pill" style="left:' + tp + '%">Hoje</span>' : '') + '</div></div>' + rows + (showT ? '<div class="tl-ov"><div class="tl-today" style="left:' + tp + '%"></div></div>' : '') + '</div></div>';
}

  if (phase === 'login'){ app.innerHTML = loginView(); return; }

  if (phase === 'erro'){ app.innerHTML = gateView('Algo deu errado', '<p>Não consegui verificar seu acesso. Confira a conexão e se as regras do Firebase foram publicadas.</p><p class="muted small">Detalhe técnico: ' + esc(fatalMsg) + '</p><button class="btn btn-primary btn-block" data-act="retry-access">Tentar de novo</button><button class="link" data-act="logout">Sair</button>'); return; }

  if (selInit && S.selEd !== 'all' && !edById(S.selEd)) S.selEd = 'all';

  const V = {inicio:viewInicio, edicoes:viewEdicoes, financeiro:viewFinanceiro, estoque:viewEstoque, organizacional:viewOrg, equipe:viewEquipe, relatorios:viewRel, acessos:viewAcessos, config:viewConfig, busca:viewBusca, mais:viewMais};
  const keep = !forceNext; forceNext = false;
  const saved = keep ? snapForms(app) : null;
  app.innerHTML = shell((V[U.view] || viewInicio)());
  if (saved) restoreForms(app, saved);
}
function snapForms(app){
  const out = [];
  app.querySelectorAll('form[data-form] [id]').forEach(el => {
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || /^(file|submit|button|hidden|password)$/.test(el.type || '')) return;
    out.push({id:el.id, v:el.value, c:el.checked});
  });
  return out;
}
function restoreForms(app, saved){
  saved.forEach(x => {
    const el = document.getElementById(x.id); if (!el || !app.contains(el)) return;
    if (el.type === 'radio' || el.type === 'checkbox'){ el.checked = x.c; }
    else if (el.tagName === 'SELECT'){ if (Array.prototype.some.call(el.options, o => o.value === x.v)) el.value = x.v; }
    else el.value = x.v;
  });
  const tp = app.querySelector('form[data-form="lanc"] input[name="tipo"]:checked');
  const g = app.querySelector('#fg-setor'); if (tp && g) g.hidden = tp.value === 'receita';
}

function permOps(from, to){
  const ops = [];

    let ch = false; const np = {};
    Object.keys(perm || {}).forEach(m => { const p = perm[m]; if (p && Array.isArray(p.s) && p.s.indexOf(from) >= 0){ ch = true; np[m] = {all:!!p.all, s:p.s.map(x => x === from ? to : x).filter(x => x !== null)}; } else np[m] = p; });
    return ch ? np : null;
  };
  S.users.filter(u => u.papel !== 'admin').forEach(u => { const np = fix(u.perm); if (np) ops.push(upd('users/' + u.id, {perm:np})); });
  S.convites.forEach(c => { const np = fix(c.perm); if (np) ops.push(upd('convites/' + c.id, {perm:np})); });

}
function renameOps(kind, a, b){

    S.files.filter(f => f.pasta === 'setor:' + a).forEach(f => ops.push(upd('arquivos/' + f.id, {pasta:'setor:' + b, chave:b})));
    S.team.filter(t => t.alvo === 'setor:' + a).forEach(t => ops.push(upd('equipe/' + t.id, {alvo:'setor:' + b, chave:b})));

      if (email !== old){ if (S.users.some(u => (u.email || '').toLowerCase() === email) || S.convites.some(c => c.id === email)){ toast('Já existe alguém com esse e-mail.'); return; } ops.push({t:'del', path:'convites/' + old}, {t:'set', path:'convites/' + email, data:{nome, perm, por:rec.por || ME().nome}}); }
      else ops.push(upd('convites/' + old, {nome, perm}));
      if (await W(() => BE.db.batch(ops))){ closeModal(); toast('Convite atualizado.'); }
      return;
    }
    const ops = [upd('users/' + rec.id, admin ? {nome} : {nome, perm})];
    if (!admin && S.convites.some(c => c.id === (rec.email || '').toLowerCase())) ops.push(upd('convites/' + rec.email.toLowerCase(), {nome, perm}));
    if (await W(() => BE.db.batch(ops))){ closeModal(); toast('Acesso atualizado.'); }
  },
  'cfg-add': async f => {
    if (needAdmin()) return;
    const kind = fv(f, 'kind'), nome = fv(f, 'nome').trim(); if (!nome){ toast('Escreva um nome.'); return; }
    const c = S.cfg; let patch;
    if (kind === 'area'){ if (nameTaken(c.areas.map(a => a.nome), nome)){ toast('Já existe uma área com esse nome.'); return; } patch = {areas:c.areas.concat([{nome, setores:[]}])}; }
    else if (kind === 'setor'){ if (nameTaken(allSetores(), nome)){ toast('Já existe um setor com esse nome.'); return; } const an = fv(f, 'area'); if (!c.areas.some(a => a.nome === an)) return; patch = {areas:c.areas.map(a => a.nome === an ? {nome:a.nome, setores:a.setores.concat([nome])} : a)}; }
    else { const key = kind === 'cargo' ? 'cargos' : kind === 'unidade' ? 'unidades' : 'cats'; if (nameTaken(c[key], nome)){ toast('Esse nome já existe na lista.'); return; } patch = {}; patch[key] = c[key].concat([nome]); }
    if (await W(() => BE.db.update('config/app', patch))){ if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); toast('Adicionado.'); scheduleRender(true); }
  },
  'cfg-ren': async f => {
    if (needAdmin()) return;
    const kind = fv(f, 'kind'), key = fv(f, 'key'), nome = fv(f, 'nome').trim(), c = S.cfg;
    if (!nome){ toast('Escreva um nome.'); return; }
    if (nome === key){ closeModal(); return; }
    const lista = kind === 'area' ? c.areas.map(a => a.nome) : kind === 'setor' ? allSetores() : kind === 'cargo' ? c.cargos : kind === 'unidade' ? c.unidades : c.cats;
    if (nameTaken(lista, nome, key)){ toast('Esse nome já existe.'); return; }
    if (await W(() => BE.db.batch(renameOps(kind, key, nome)))){ if (kind === 'setor' || kind === 'area') { if (U.org.pasta === kind + ':' + key) U.org.pasta = kind + ':' + nome; } resetFilters(); closeModal(); toast('Renomeado em todos os registros.'); }
  },
  'cfg-brand': async f => {
    if (needAdmin()) return;
    const nome = fv(f, 'nome').trim(), sigla = fv(f, 'sigla').trim().toUpperCase(), sub = fv(f, 'sub').trim(), cor = (f.querySelector('input[name=cor]:checked') || {}).value;
    if (!nome){ toast('Dê um nome para a plataforma.'); return; }
    if (!sigla){ toast('Escreva a sigla do logo (1 ou 2 letras).'); return; }
    const patch = {nome, sigla:sigla.slice(0, 2), sub}; if (cor) patch.cor = cor;
    if (await W(() => BE.db.update('config/app', patch))) toast('Identidade salva.');
  },
  'cfg-menu': async f => {
    if (needAdmin()) return;
    const m = {};
    for (const k of Object.keys(DEF_MENU)){ const v = fv(f, k).trim(); if (!v){ toast('Nenhum nome do menu pode ficar vazio.'); return; } m[k] = v.slice(0, 24); }
    if (await W(() => BE.db.update('config/app', {menu:m}))) toast('Nomes do menu salvos.');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const h = ACTS[el.dataset.act]; if (h){ h(el, e); }
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.chg === 'mov-prev' && e.target.type === 'text') movPrev(); });
document.addEventListener('change', e => {
  const c = e.target.dataset && e.target.dataset.chg; if (c && CHG[c]) CHG[c](e.target);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const h = FORMS[f.dataset.form]; if (h) h(f);
});
document.addEventListener('focusout', () => { if (pend) setTimeout(() => scheduleRender(), 80); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal .ov')) closeModal(); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('.dropzone'); if (z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('.dropzone'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('.dropzone'); if (z){ e.preventDefault(); z.classList.remove('over'); const l = Array.from((e.dataTransfer && e.dataTransfer.files) || []); if (l.length) addFiles(l); } });

function applyTheme(){
  const r = document.documentElement;
  if (S && (S.theme === 'light' || S.theme === 'dark')) r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
}

/* ---------- partida ---------- */
S = emptyState(); U = mkUI(); render();
window.__vvWatch = setTimeout(() => { if (phase === 'pre'){ phase = 'erro'; fatalMsg = 'o Firebase não carregou (confira a internet)'; render(); } }, 10000);
window.VVApp = {start:startApp, fail:msg => { clearTimeout(window.__vvWatch); phase = 'erro'; fatalMsg = msg; render(); }, get S(){ return S; }, get U(){ return U; }, get phase(){ return phase; }, render, go};
})();

const V = '10.14.1';

try {
  const configOk = !!firebaseConfig.apiKey && !!firebaseConfig.projectId && JSON.stringify(firebaseConfig).indexOf('COLE_AQUI') < 0;
  if (!configOk) {
    window.VVApp.start(null, false);
  } else {
    const [{ initializeApp }, A, F, ST] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'),
      import(base + 'firebase-firestore.js'), import(base + 'firebase-storage.js')
    ]);
    const app = initializeApp(firebaseConfig);
    const auth = A.getAuth(app);
    let db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch (e) { db = F.initializeFirestore(app, {}); }
    const storage = ST.getStorage(app);
    const who = u => ({ uid: u.uid, email: u.email || '', emailVerified: !!u.emailVerified, displayName: u.displayName || '' });
    const dec = data => {
      const o = {};
      Object.keys(data).forEach(k => {
        const v = data[k];
        if (v && typeof v === 'object' && !Array.isArray(v) && v.__inc !== undefined) o[k] = F.increment(v.__inc);
        else if (v && typeof v === 'object' && !Array.isArray(v) && v.__del) o[k] = F.deleteField();
        else o[k] = v;
      });
      return o;
    };
    const backend = {
      auth: {
        onChange: cb => A.onAuthStateChanged(auth, u => cb(u ? who(u) : null)),
        signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
        signUp: async (e, p) => { const c = await A.createUserWithEmailAndPassword(auth, e, p); try { await A.sendEmailVerification(c.user); } catch (x) {} return c; },
        signOut: () => A.signOut(auth),
        verifyMail: () => A.sendEmailVerification(auth.currentUser),
        reset: e => A.sendPasswordResetEmail(auth, e),
        refresh: async () => { const u = auth.currentUser; await A.reload(u); await u.getIdToken(true); return who(u); }
      },
      db: {
        newId: coll => F.doc(F.collection(db, coll)).id,
        get: async path => { const s = await F.getDoc(F.doc(db, path)); return s.exists() ? s.data() : null; },
        set: (path, data) => F.setDoc(F.doc(db, path), data),
        update: (path, patch) => F.updateDoc(F.doc(db, path), dec(patch)),
        del: path => F.deleteDoc(F.doc(db, path)),
        batch: async ops => {
          for (let i = 0; i < ops.length; i += 400) {
            const b = F.writeBatch(db);
            ops.slice(i, i + 400).forEach(o => {
              const r = F.doc(db, o.path);
              if (o.t === 'set') b.set(r, o.data); else if (o.t === 'update') b.update(r, dec(o.data)); else b.delete(r);
            });
            await b.commit();
          }
        },
        listenDoc: (path, cb, err) => F.onSnapshot(F.doc(db, path), s => cb(s.exists() ? s.data() : null), err),
        listenQuery: (coll, flt, cb, err) => F.onSnapshot(
          flt ? F.query(F.collection(db, coll), F.where(flt.field, '==', flt.eq)) : F.collection(db, coll),
          s => cb(s.docs.map(d => Object.assign({ id: d.id }, d.data()))), err)
      },
      storage: {
        put: (path, file) => ST.uploadBytes(ST.ref(storage, path), file),
        blob: path => ST.getBlob(ST.ref(storage, path)),
        rm: path => ST.deleteObject(ST.ref(storage, path))
      }
    };
    window.VVApp.start(backend, true);
  }
} catch (e) {
  console.error(e);
  window.VVApp.fail(String(e && e.message ? e.message : e));
}
